<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="225" height="48" viewBox="0 0 225 48" role="img" aria-label="Motionfolio">
<title>Motionfolio</title>
<style>@font-face{font-family:O7;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:M7;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.rise{transform-box:fill-box;animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.fade{animation:fade .8s ease-out both}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.16,1,.3,1) both}
.beacon{transform-box:fill-box;transform-origin:center;animation:beacon 2.4s ease-out infinite}
.blink{animation:blink 1.1s steps(2,start) infinite}
.marq{animation:marq 26s linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes beacon{0%{opacity:.7;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.8)}}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>

<g><rect x="6.0" y="6.0" width="219.0" height="40.0" rx="12" fill="#1C1917"/><rect x="2.0" y="2.0" width="219.0" height="40.0" rx="12" fill="#FFFDF8" stroke="#1C1917" stroke-width="2"/></g>
