<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Rushikesh Panchal</title>
  <desc id="desc">I build software that can explain itself. Full-stack engineering, explainable AI and business systems.</desc>
  <style>
    .serif { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; letter-spacing: .02em; }
    .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
    .s { font-size: 13px; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .fade { animation: fade .9s ease-out both; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .bar, .fade, .caret { animation: none; } }
  </style>

  <rect width="1200" height="380" rx="20" fill="#F6F3EC"/>

  <!-- left: name and statement -->
  <g class="fade">
    <circle cx="68" cy="78" r="5" fill="#1F5A47"/>
    <text x="84" y="83" class="mono" font-size="14" fill="#6B665C">RUSHIKESH PANCHAL  /  @rrushikeshp89</text>

    <text x="60" y="170" class="serif" font-size="56" fill="#1C1B18">I build software</text>
    <text x="60" y="236" class="serif" font-size="56" fill="#1C1B18">that can <tspan font-style="italic" fill="#1F5A47">explain itself.</tspan></text>

    <text x="62" y="300" class="sans" font-size="17" fill="#6B665C">Full-stack engineering  ·  explainable AI  ·  business systems</text>
  </g>

  <!-- right: a fit-score breakdown, the idea behind most of my work -->
  <g>
    <rect x="772" y="54" width="368" height="272" rx="14" fill="#FFFFFF" stroke="#E4DFD3"/>
    <text x="796" y="90" class="mono s" fill="#6B665C">why this score?</text>
    <text x="1116" y="90" text-anchor="end" class="mono" font-size="13" fill="#1F5A47">fit 0.79</text>
    <line x1="796" y1="110" x2="1116" y2="110" stroke="#E4DFD3"/>
    
    <text x="796" y="149" class="mono s" fill="#6B665C">semantic</text>
    <rect x="904" y="140" width="150" height="10" rx="5" fill="#EEEAE1"/>
    <rect x="904" y="140" width="123" height="10" rx="5" fill="#1F5A47" class="bar" style="animation-delay:0.25s"/>
    <text x="1116" y="149" text-anchor="end" class="mono s" fill="#1C1B18">×0.40</text>
    <text x="796" y="185" class="mono s" fill="#6B665C">skills</text>
    <rect x="904" y="176" width="150" height="10" rx="5" fill="#EEEAE1"/>
    <rect x="904" y="176" width="129" height="10" rx="5" fill="#2F7A60" class="bar" style="animation-delay:0.37s"/>
    <text x="1116" y="185" text-anchor="end" class="mono s" fill="#1C1B18">×0.35</text>
    <text x="796" y="221" class="mono s" fill="#6B665C">experience</text>
    <rect x="904" y="212" width="150" height="10" rx="5" fill="#EEEAE1"/>
    <rect x="904" y="212" width="100" height="10" rx="5" fill="#C2873A" class="bar" style="animation-delay:0.49s"/>
    <text x="1116" y="221" text-anchor="end" class="mono s" fill="#1C1B18">×0.15</text>
    <text x="796" y="257" class="mono s" fill="#6B665C">education</text>
    <rect x="904" y="248" width="150" height="10" rx="5" fill="#EEEAE1"/>
    <rect x="904" y="248" width="90" height="10" rx="5" fill="#8A8478" class="bar" style="animation-delay:0.61s"/>
    <text x="1116" y="257" text-anchor="end" class="mono s" fill="#1C1B18">×0.10</text>
    <text x="796" y="300" class="mono" font-size="12" fill="#6B665C">every number shows its working<tspan class="caret" fill="#1F5A47"> _</tspan></text>
  </g>
</svg>
