<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="528" viewBox="0 0 400 528" role="img" aria-label="Readmission Shield: flags 30-day readmission risk for diabetic patients. 0.55 recall on a 9 to 91 class imbalance, SHAP reasons for every score. XGBoost, SHAP, Streamlit.">
<title>Readmission Shield: flags 30-day readmission risk for diabetic patients. 0.55 recall on a 9 to 91 class imbalance, SHAP reasons for every score. XGBoost, SHAP, Streamlit.</title>
<style>
  .serif { font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; letter-spacing: .04em; }
  .sans { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .grow { animation: none; } }
</style>
<rect x="1" y="1" width="398" height="526" rx="18" fill="#141815" stroke="#283029"/>
<rect x="22" y="22" width="356" height="190" rx="12" fill="#1A1F1B" stroke="#283029"/>
<text x="42" y="54" class="mono" font-size="13" fill="#7F7A70">why this patient is high risk</text>
<text x="42" y="96" class="sans" font-size="15" fill="#ECEAE4">prior visits</text>
<rect x="180" y="86" width="147" height="10" rx="5" fill="#E0A85C" opacity="1.0" class="grow" style="animation-delay:0.20s"/>
<text x="358" y="96" class="mono" font-size="15" fill="#E0A85C" text-anchor="end">+</text>
<text x="42" y="138" class="sans" font-size="15" fill="#ECEAE4">discharge to SNF</text>
<rect x="180" y="128" width="102" height="10" rx="5" fill="#E0A85C" opacity="0.8" class="grow" style="animation-delay:0.32s"/>
<text x="358" y="138" class="mono" font-size="15" fill="#E0A85C" text-anchor="end">+</text>
<text x="42" y="180" class="sans" font-size="15" fill="#ECEAE4">age over 70</text>
<rect x="180" y="170" width="74" height="10" rx="5" fill="#E0A85C" opacity="0.6" class="grow" style="animation-delay:0.44s"/>
<text x="358" y="180" class="mono" font-size="15" fill="#E0A85C" text-anchor="end">+</text>
<text x="28" y="254" class="mono" font-size="13" fill="#7CC7A4">CLINICAL ML</text>
<text x="28" y="293" class="serif" font-size="31" fill="#ECEAE4">Readmission Shield</text>
<text x="28" y="334" class="sans" font-size="18" fill="#A9A498">Flags 30-day readmission risk</text>
<text x="28" y="360" class="sans" font-size="18" fill="#A9A498">before a patient leaves.</text>
<rect x="28" y="403" width="6" height="6" rx="1.5" fill="#7CC7A4"/>
<text x="48" y="412" class="sans" font-size="16" fill="#A9A498"><tspan font-weight="600" fill="#ECEAE4">0.55 recall</tspan> on a 9:91 imbalance</text>
<rect x="28" y="433" width="6" height="6" rx="1.5" fill="#7CC7A4"/>
<text x="48" y="442" class="sans" font-size="16" fill="#A9A498"><tspan font-weight="600" fill="#ECEAE4">SHAP reasons</tspan> for every score</text>
<rect x="28" y="470" width="72" height="26" rx="13.0" fill="#1D221E" stroke="#283029"/>
<text x="64.0" y="485" class="mono" font-size="12" fill="#A9A498" text-anchor="middle">XGBoost</text>
<rect x="106" y="470" width="50" height="26" rx="13.0" fill="#1D221E" stroke="#283029"/>
<text x="131.0" y="485" class="mono" font-size="12" fill="#A9A498" text-anchor="middle">SHAP</text>
<rect x="162" y="470" width="87" height="26" rx="13.0" fill="#1D221E" stroke="#283029"/>
<text x="205.5" y="485" class="mono" font-size="12" fill="#A9A498" text-anchor="middle">Streamlit</text>
</svg>
