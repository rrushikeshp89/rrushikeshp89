<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Along the way: Dec 2025 Readmission Shield, Mar 2026 Tessaract and StrategyRoom, Oct 2026 Stockroom and LeadHub, Nov 2026 Grove.">
